<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Pet - Cadastrar Reserva</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <div class="layout">

        <aside class="menu-lateral">

            <h1>Hotel Pet</h1>

            <nav>

                <a href="dashboard.html">
                    Início
                </a>

                <a href="pets.html">
                    Pet
                </a>

                <a href="usuarios.html">
                    Usuário
                </a>

                <a href="configuracoes.html">
                    Configurações
                </a>

                <a
                    href="reservas.html"
                    class="menu-ativo"
                >
                    Reservas
                </a>

            </nav>

        </aside>

        <main class="conteudo">

            <header class="topo">

                <div></div>

                <a
                    href="perfil.html"
                    class="perfil-topo"
                >

                    <span class="icone-usuario" aria-label="Perfil do usuário">
    👤
</span>

                    <span id="nome-usuario-topo">Camila Oliveira</span>

                </a>

            </header>

            <section class="area-principal">

                <div class="breadcrumb">

                    <a href="dashboard.html">
                        Home
                    </a>

                    <span>/</span>

                    <a href="reservas.html">
                        Reservas
                    </a>

                    <span>/</span>

                    <strong>
                        Cadastrar Reserva
                    </strong>

                </div>

                <div class="cabecalho-pagina">

                    <div>

                        <h2>
                            Cadastrar Reserva
                        </h2>

                        <p>
                            Preencha os dados para cadastrar uma nova reserva.
                        </p>

                    </div>

                </div>

                <section class="painel-formulario">

                    <form
                        action="reservas.html"
                        method="get"
                    >

                        <div class="grupo-formulario">

                            <h3>
                                Dados da Reserva
                            </h3>

                            <div class="linha-formulario">

                                <div class="campo-formulario">

                                    <label for="pet">
                                        Pet
                                    </label>

                                    <select
                                        id="pet"
                                        name="pet"
                                        required
                                    >

                                        <option value="">
                                            Selecione o pet
                                        </option>

                                        <option value="max">
                                            Max
                                        </option>

                                        <option value="belinha">
                                            Belinha
                                        </option>

                                        <option value="nina">
                                            Nina
                                        </option>

                                        <option value="caramelo">
                                            Caramelo
                                        </option>

                                    </select>

                                </div>

                                <div class="campo-formulario">

                                    <label for="tutor">
                                        Tutor
                                    </label>

                                    <select
                                        id="tutor"
                                        name="tutor"
                                        required
                                    >

                                        <option value="">
                                            Selecione o tutor
                                        </option>

                                        <option value="rafael">
                                            Rafael Costa
                                        </option>

                                        <option value="juliana">
                                            Juliana Mendes
                                        </option>

                                        <option value="pedro">
                                            Pedro Henrique
                                        </option>

                                        <option value="lucas">
                                            Lucas Almeida
                                        </option>

                                    </select>

                                </div>

                            </div>

                            <div class="linha-formulario">

                                <div class="campo-formulario">

                                    <label for="entrada">
                                        Data de entrada
                                    </label>

                                    <input
                                        type="date"
                                        id="entrada"
                                        name="entrada"
                                        required
                                    >

                                </div>

                                <div class="campo-formulario">

                                    <label for="saida">
                                        Data de saída
                                    </label>

                                    <input
                                        type="date"
                                        id="saida"
                                        name="saida"
                                        required
                                    >

                                </div>

                            </div>

                        </div>

                        <div class="grupo-formulario">

                            <h3>
                                Serviços e cuidados
                            </h3>

                            <div class="linha-formulario">

                                <div class="campo-formulario">

                                    <label for="alimentacao">
                                        Alimentação
                                    </label>

                                    <select
                                        id="alimentacao"
                                        name="alimentacao"
                                        required
                                    >

                                        <option value="">
                                            Selecione
                                        </option>

                                        <option value="hotel">
                                            Alimentação do Hotel
                                        </option>

                                        <option value="propria">
                                            Alimentação própria
                                        </option>

                                    </select>

                                </div>

                                <div class="campo-formulario">

                                    <label for="medicacao">
                                        Necessita de medicação?
                                    </label>

                                    <select
                                        id="medicacao"
                                        name="medicacao"
                                        required
                                    >

                                        <option value="">
                                            Selecione
                                        </option>

                                        <option value="sim">
                                            Sim
                                        </option>

                                        <option value="nao">
                                            Não
                                        </option>

                                    </select>

                                </div>

                            </div>

                            <div class="campo-formulario campo-completo">

                                <label for="observacoes">
                                    Observações
                                </label>

                                <textarea
                                    id="observacoes"
                                    name="observacoes"
                                    rows="5"
                                    placeholder="Informe cuidados especiais, horários de alimentação ou outras informações importantes."
                                ></textarea>

                            </div>

                        </div>

                        <div class="grupo-formulario">

                            <h3>
                                Pagamento
                            </h3>

                            <div class="linha-formulario">

                                <div class="campo-formulario">

                                    <label for="forma-pagamento">
                                        Forma de pagamento
                                    </label>

                                    <select
                                        id="forma-pagamento"
                                        name="forma-pagamento"
                                        required
                                    >

                                        <option value="">
                                            Selecione
                                        </option>

                                        <option value="pix">
                                            Pix
                                        </option>

                                        <option value="cartao">
                                            Cartão
                                        </option>

                                        <option value="dinheiro">
                                            Dinheiro
                                        </option>

                                    </select>

                                </div>

                                <div class="campo-formulario">

                                    <label for="status">
                                        Status da reserva
                                    </label>

                                    <select
                                        id="status"
                                        name="status"
                                        required
                                    >

                                        <option value="agendada">
                                            Agendada
                                        </option>

                                        <option value="confirmada">
                                            Confirmada
                                        </option>

                                    </select>

                                </div>

                            </div>

                            <div class="linha-formulario">
    <div class="campo-formulario">
        <label for="valor">Valor da diária</label>
        <input type="text" id="valor" name="valor" value="R$ 95,00" readonly>
    </div>

    <div class="campo-formulario">
        <label for="valor-total">Valor total da hospedagem</label>
        <input type="text" id="valor-total" name="valor-total"
               value="R$ 0,00" readonly>
    </div>
</div>

                            </div>

                        </div>

                        <div class="acoes-formulario">

                            <button
                                type="submit"
                                class="botao-principal"
                            >
                                Salvar Reserva
                            </button>

                            <button
                                type="reset"
                                class="botao-secundario"
                            >
                                Limpar
                            </button>

                            <a
                                href="reservas.html"
                                class="botao-cancelar"
                            >
                                Cancelar
                            </a>

                        </div>

                    </form>

                </section>

            </section>

        </main>

    </div>
<script src="../js/reservas.js"></script>
<script src="../js/nome-usuario.js"></script>
</body>

</html>
