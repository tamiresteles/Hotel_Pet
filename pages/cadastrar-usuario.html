<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Pet - Cadastrar Usuário</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <div class="layout">

        <aside class="menu-lateral">

            <h1>Hotel Pet</h1>

            <nav>

                <a href="dashboard.html">
                    Início
                </a>

                <a href="pets.html">
                    Pet
                </a>

                <a
                    href="usuarios.html"
                    class="menu-ativo"
                >
                    Usuário
                </a>

                <a href="configuracoes.html">
                    Configurações
                </a>

                <a href="reservas.html">
                    Reservas
                </a>

            </nav>

        </aside>

        <main class="conteudo">

            <header class="topo">

                <div></div>

                <a
                    href="perfil.html"
                    class="perfil-topo"
                >

                    <span class="icone-usuario" aria-label="Perfil do usuário">
    👤
</span>

                    <span id="nome-usuario-topo">Camila Oliveira</span>

                </a>

            </header>

            <section class="area-principal">

                <div class="breadcrumb">

                    <a href="dashboard.html">
                        Home
                    </a>

                    <span>/</span>

                    <a href="usuarios.html">
                        Usuários
                    </a>

                    <span>/</span>

                    <strong>
                        Cadastrar Usuário
                    </strong>

                </div>

                <div class="cabecalho-pagina">

                    <div>

                        <h2>
                            Cadastrar Usuário
                        </h2>

                        <p>
                            Preencha os dados para cadastrar um novo usuário.
                        </p>

                    </div>

                </div>

                <section class="painel-formulario">

                    <form
                        action="usuarios.html"
                        method="get"
                        enctype="multipart/form-data"
                    >

                        <div class="grupo-formulario">

                            <h3>
                                Dados pessoais
                            </h3>

                            <div class="linha-formulario">

                                <div class="campo-formulario">

                                    <label for="nome">
                                        Nome
                                    </label>

                                    <input
                                        type="text"
                                        id="nome"
                                        name="nome"
                                        placeholder="Digite o nome"
                                        required
                                    >

                                </div>

                                <div class="campo-formulario">

                                    <label for="sobrenome">
                                        Sobrenome
                                    </label>

                                    <input
                                        type="text"
                                        id="sobrenome"
                                        name="sobrenome"
                                        placeholder="Digite o sobrenome"
                                        required
                                    >

                                </div>

                            </div>

                            <div class="linha-formulario">

                                <div class="campo-formulario">

                                    <label for="email">
                                        E-mail
                                    </label>

                                    <input
                                        type="email"
                                        id="email"
                                        name="email"
                                        placeholder="Digite o e-mail"
                                        required
                                    >

                                </div>

                                <div class="campo-formulario">

                                    <label for="telefone">
                                        Telefone
                                    </label>

                                    <input
                                        type="tel"
                                        id="telefone"
                                        name="telefone"
                                        placeholder="(00) 00000-0000"
                                        required
                                    >

                                </div>

                            </div>

                        </div>

                        <div class="grupo-formulario">

                            <h3>
                                Endereço
                            </h3>

                            <div class="linha-formulario">

                                <div class="campo-formulario">

                                    <label for="cep">
                                        CEP
                                    </label>

                                    <input
                                        type="text"
                                        id="cep"
                                        name="cep"
                                        placeholder="00000-000"
                                        required
                                    >

                                </div>

                                <div class="campo-formulario">

                                    <label for="cidade">
                                        Cidade
                                    </label>

                                    <input
                                        type="text"
                                        id="cidade"
                                        name="cidade"
                                        placeholder="Digite a cidade"
                                        required
                                    >

                                </div>

                            </div>

                            <div class="linha-formulario">

                                <div class="campo-formulario">

                                    <label for="endereco">
                                        Endereço
                                    </label>

                                    <input
                                        type="text"
                                        id="endereco"
                                        name="endereco"
                                        placeholder="Rua ou Avenida"
                                        required
                                    >

                                </div>

                                <div class="campo-formulario">

                                    <label for="numero">
                                        Número
                                    </label>

                                    <input
                                        type="text"
                                        id="numero"
                                        name="numero"
                                        placeholder="Número"
                                        required
                                    >

                                </div>

                            </div>

                        </div>

                        <div class="grupo-formulario">

                            <h3>
                                Acesso ao sistema
                            </h3>

                            <div class="linha-formulario">

                                <div class="campo-formulario">

                                    <label for="senha">
                                        Senha
                                    </label>

                                    <input
                                        type="password"
                                        id="senha"
                                        name="senha"
                                        placeholder="Digite a senha"
                                        required
                                    >

                                </div>

                                <div class="campo-formulario">

                                    <label for="confirmar-senha">
                                        Confirmar senha
                                    </label>

                                    <input
                                        type="password"
                                        id="confirmar-senha"
                                        name="confirmar-senha"
                                        placeholder="Confirme a senha"
                                        required
                                    >

                                </div>

                            </div>

                            <div class="linha-formulario">

                                <div class="campo-formulario">

                                    <label for="funcao">
                                        Função
                                    </label>

                                    <select
                                        id="funcao"
                                        name="funcao"
                                        required
                                    >

                                        <option value="">
                                            Selecione a função
                                        </option>

                                        <option value="cliente">
                                            Cliente
                                        </option>

                                        <option value="funcionario">
                                            Funcionário
                                        </option>

                                        <option value="gerente">
                                            Gerente
                                        </option>

                                    </select>

                                </div>

                                <div class="campo-formulario">

                                    <label for="status">
                                        Status
                                    </label>

                                    <select
                                        id="status"
                                        name="status"
                                        required
                                    >

                                        <option value="ativo">
                                            Ativo
                                        </option>

                                        <option value="inativo">
                                            Inativo
                                        </option>

                                    </select>

                                </div>

                            </div>

                        </div>

                        <div class="grupo-formulario">

                            <h3>
                                Foto do usuário
                            </h3>

                            <div class="campo-formulario campo-completo">

                                <label for="foto">
                                    Selecionar foto
                                </label>

                                <input
                                    type="file"
                                    id="foto"
                                    name="foto"
                                    accept="image/*"
                                >

                            </div>

                        </div>

                        <div class="acoes-formulario">

                            <button
                                type="submit"
                                class="botao-principal"
                            >
                                Salvar Usuário
                            </button>

                            <button
                                type="reset"
                                class="botao-secundario"
                            >
                                Limpar
                            </button>

                            <a
                                href="usuarios.html"
                                class="botao-cancelar"
                            >
                                Cancelar
                            </a>

                        </div>

                    </form>

                </section>

            </section>

        </main>

    </div>
<script src="../js/nome-usuario.js"></script>
</body>

</html>
