<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Pet - Pets</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <div class="layout">

        <aside class="menu-lateral">

            <h1>Hotel Pet</h1>

            <nav>

                <a href="dashboard.html">
                    Início
                </a>

                <a
                    href="pets.html"
                    class="menu-ativo"
                >
                    Pet
                </a>

                <a href="usuarios.html">
                    Usuário
                </a>

                <a href="configuracoes.html">
                    Configurações
                </a>

                <a href="reservas.html">
                    Reservas
                </a>

                
<a href="../index.html" onclick="return confirm('Deseja realmente sair do Hotel Pet?');">
    Sair
</a>


            </nav>

        </aside>

        <main class="conteudo">

            <header class="topo">

                <div></div>

                <a
                    href="perfil.html"
                    class="perfil-topo"
                >

                    <span class="icone-usuario" aria-label="Perfil do usuário">
    👤
</span>

                   <span id="nome-usuario-topo">Camila Oliveira</span>
                </a>

            </header>

            <section class="area-principal">

                <div class="breadcrumb">

                    <a href="dashboard.html">
                        Home
                    </a>

                    <span>/</span>

                    <strong>
                        Pets
                    </strong>

                </div>

                <div class="cabecalho-pagina">

                    <div>

                        <h2>
                            Pets
                        </h2>

                        <p>
                            Consulte e gerencie os pets cadastrados no Hotel Pet.
                        </p>

                    </div>

                    <a
                        href="cadastrar-pet.html"
                        class="botao-principal"
                    >
                        Novo Pet
                    </a>

                </div>

                <section class="painel-filtros">

                        <form id="form-pesquisa-pets">

                        <div class="campo-filtro">

                            <label for="pesquisa">
                                Pesquisar
                            </label>

                            <input
                                type="search"
                                id="pesquisa"
                                name="pesquisa"
                                placeholder="Digite o nome do pet"
                            >

                        </div>

                    </form>

                </section>

                <section class="painel-dashboard">

                    <div class="cabecalho-secao">

                        <h3>
                            Pets cadastrados
                        </h3>

                        <span id="total-pets">0 pets encontrados</span>

                    </div>

                    <div class="tabela-container">

                        <table>

                            <thead>

                                <tr>

                                    <th>
                                        ID
                                    </th>

                                    <th>
                                        Pet
                                    </th>

                                    <th>
                                        Raça
                                    </th>

                                    <th>
                                        Idade
                                    </th>

                                    <th>
                                        Tutor
                                    </th>

                                    <th>
                                        Status
                                    </th>

                                    <th>
                                        Ações
                                    </th>

                                </tr>

                            </thead>

                           <tbody id="lista-pets">
</tbody>

                        </table>

                    </div>

                </section>

            </section>

        </main>

    </div>
    
<script src="../js/nome-usuario.js"></script>
<script src="../js/lista-pets.js"></script>
</body>

</html>
