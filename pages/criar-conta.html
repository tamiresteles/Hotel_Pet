<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Pet - Criar Conta</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body class="pagina-login">

    <main class="login-container">

        <section class="login-imagem">

           <img
    src="../imagens/hotel-pet.png"
    alt="Hotel Pet"
>
        </section>

        <section class="login-formulario">

            <div class="login-cabecalho">

                <h1>Hotel Pet</h1>

                <p>
                    Sistema de gerenciamento de hospedagem para Pets
                </p>

            </div>

            <h2>Criar Conta</h2>

            <form id="form-criar-conta">
            >

                <div class="campo-login">

                    <label for="nome">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        required
                    >

                </div>

                <div class="campo-login">

                    <label for="sobrenome">
                        Sobrenome
                    </label>

                    <input
                        type="text"
                        id="sobrenome"
                        name="sobrenome"
                        placeholder="Digite seu sobrenome"
                        required
                    >

                </div>

                <div class="campo-login">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                    >

                </div>

                <div class="campo-login">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>

                <div class="campo-login">

                    <label for="confirmar-senha">
                        Confirmar senha
                    </label>

                    <input
                        type="password"
                        id="confirmar-senha"
                        name="confirmar-senha"
                        placeholder="Confirme sua senha"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="botao-entrar"
                >
                    Criar Conta
                </button>

            </form>

                 <p id="mensagem-cadastro" role="status"></p>

            <p class="criar-conta-login">

                Já possui uma conta?

                <a href="../index.html">
                    Voltar para o Login
                </a>

            </p>

        </section>

    </main>
    <script>
        document.getElementById("form-criar-conta")
            .addEventListener("submit", function (evento) {
                evento.preventDefault();

                const senha = document.getElementById("senha").value;
                const confirmarSenha =
                    document.getElementById("confirmar-senha").value;

                const mensagem =
                    document.getElementById("mensagem-cadastro");

                if (senha !== confirmarSenha) {
                    mensagem.textContent = "As senhas não coincidem.";
                    return;
                }

                mensagem.textContent =
                    "Cadastro demonstrativo concluído! Os dados não foram salvos.";
            });
    </script>

</body>

</html>
