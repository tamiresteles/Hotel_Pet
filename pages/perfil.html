<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Pet - Meu Perfil</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="layout">

        <aside class="menu-lateral">
            <h1>Hotel Pet</h1>

            <nav>
                <a href="dashboard.html">Início</a>
                <a href="pets.html">Pet</a>
                <a href="usuarios.html">Usuário</a>
                <a href="configuracoes.html">Configurações</a>
                <a href="reservas.html">Reservas</a>
            </nav>
        </aside>

        <main class="conteudo">

            <header class="topo">
                <div></div>

               <a href="perfil.html" class="perfil-topo">
    <div class="icone-usuario">👤</div>
    <span id="nome-usuario-topo">Camila Oliveira</span>
</a>
            </header>

            <section class="area-principal">

                <div class="breadcrumb">
                    <a href="dashboard.html">Home</a>
                    <span>/</span>
                    <strong>Meu Perfil</strong>
                </div>

                <div class="cabecalho-pagina">
                    <div>
                        <h2>Meu Perfil</h2>
                        <p>Consulte e atualize seus dados pessoais.</p>
                    </div>
                </div>

                <section class="painel-formulario">

                    <form id="formulario-perfil">

                        <div class="grupo-formulario">
                            <h3>Dados pessoais</h3>

                            <div class="linha-formulario">

                                <div class="campo-formulario">
                                    <label for="nome">Nome</label>
                                    <input
                                        type="text"
                                        id="nome"
                                        name="nome"
                                        value="Camila"
                                        required
                                    >
                                </div>

                                <div class="campo-formulario">
                                    <label for="sobrenome">Sobrenome</label>
                                    <input
                                        type="text"
                                        id="sobrenome"
                                        name="sobrenome"
                                        value="Oliveira"
                                        required
                                    >
                                </div>

                            </div>

                            <div class="linha-formulario">

                                <div class="campo-formulario">
                                    <label for="email">E-mail</label>
                                    <input
                                        type="email"
                                        id="email"
                                        name="email"
                                        value="camila.oliveira@email.com"
                                        required
                                    >
                                </div>

                                <div class="campo-formulario">
                                    <label for="telefone">Telefone</label>
                                    <input
                                        type="tel"
                                        id="telefone"
                                        name="telefone"
                                        value="(77) 94444-9900"
                                        required
                                    >
                                </div>

                            </div>
                        </div>

                        <div class="grupo-formulario">
                            <h3>Dados de acesso</h3>

                            <div class="linha-formulario">

                                <div class="campo-formulario">
                                    <label for="funcao">Função</label>
                                    <input
                                        type="text"
                                        id="funcao"
                                        name="funcao"
                                        value="Gerente"
                                        readonly
                                    >
                                </div>

                                <div class="campo-formulario">
                                    <label for="status">Status</label>
                                    <input
                                        type="text"
                                        id="status"
                                        name="status"
                                        value="Ativo"
                                        readonly
                                    >
                                </div>

                            </div>
                        </div>

                        <div class="grupo-formulario">
                            <h3>Alterar senha</h3>

                            <div class="linha-formulario">

                                <div class="campo-formulario">
                                    <label for="senha-atual">Senha atual</label>
                                    <input
                                        type="password"
                                        id="senha-atual"
                                        name="senha-atual"
                                        placeholder="Digite sua senha atual"
                                    >
                                </div>

                                <div class="campo-formulario">
                                    <label for="nova-senha">Nova senha</label>
                                    <input
                                        type="password"
                                        id="nova-senha"
                                        name="nova-senha"
                                        placeholder="Digite a nova senha"
                                    >
                                </div>

                            </div>

                            <div class="campo-formulario campo-completo">
                                <label for="confirmar-senha">Confirmar nova senha</label>
                                <input
                                    type="password"
                                    id="confirmar-senha"
                                    name="confirmar-senha"
                                    placeholder="Confirme a nova senha"
                                >
                            </div>
                        </div>

                        <div class="acoes-formulario">
                            <button type="submit" class="botao-principal">
                                Salvar Alterações
                            </button>

                            <button type="reset" class="botao-secundario">
                                Restaurar
                            </button>

                            <a href="dashboard.html" class="botao-cancelar">
                                Voltar
                            </a>
                        </div>

                    </form>

                </section>

            </section>

        </main>

    </div>

    <script src="../js/perfil.js"></script>
    <script src="../js/nome-usuario.js"></script>

</body>
</html>
